name: Auto build nginx:alpine with custom changes

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'
  push:
    branches:
      - 'main'
    paths:
      - Dockerfile
      - .github/workflows/**
permissions:
  contents: read

concurrency:
  group: nginx-build
  cancel-in-progress: true

jobs:
  auto_build_nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4 
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: whosneo/nginx
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Custom Nginx
            org.opencontainers.image.description=Nginx with custom changes
            org.opencontainers.image.source=https://github.com/whosneo/nginx
            org.opencontainers.image.vendor=whosneo
          cache-from: type=gha
          cache-to: type=gha,mode=max
